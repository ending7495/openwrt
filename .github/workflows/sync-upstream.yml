name: Sync Upstream With Local Priority

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/openwrt/openwrt.git
          git fetch upstream

      # 备份本地优先文件
      - name: Backup local-priority files
        run: |
          mkdir -p .sync-backup
          cp -f package/default-settings/files/zzz-default-settings .sync-backup/zzz-default-settings || true
          cp -f feeds.conf.default .sync-backup/feeds.conf.default || true

      # 合并上游，遇到冲突以 theirs（上游）为主
      - name: Merge upstream/master (theirs)
        run: |
          git checkout master   # 如果你的主分支是 main，请改为 main
          git merge upstream/master -X theirs --allow-unrelated-histories || true

      # 恢复本地优先文件
      - name: Restore local-priority files
        run: |
          cp -f .sync-backup/zzz-default-settings package/default-settings/files/zzz-default-settings || true
          cp -f .sync-backup/feeds.conf.default feeds.conf.default || true

      # 检查本地优先文件是否被成功还原，否则终止同步
      - name: Ensure local-priority files are preserved
        id: checkfiles
        run: |
          cmp -s .sync-backup/zzz-default-settings package/default-settings/files/zzz-default-settings
          ret1=$?
          cmp -s .sync-backup/feeds.conf.default feeds.conf.default
          ret2=$?
          if [ "$ret1" != "0" ] || [ "$ret2" != "0" ]; then
            echo "::error ::Local-priority files were overwritten after upstream sync. Aborting push."
            exit 1
          fi

      # 强制添加、提交、推送（仅在本地优先文件未被覆盖时）
      - name: Commit and push changes
        if: steps.checkfiles.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add package/default-settings/files/zzz-default-settings feeds.conf.default || true
          git commit -am "Auto sync upstream (with local priority for zzz-default-settings & feeds.conf.default)" || true
          git push origin master   # 如果你的主分支是 main，请改为 main
